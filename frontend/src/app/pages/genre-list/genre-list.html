@if (validGenre()) {
  <section class="border-b border-neutral-800 bg-neutral-900">
    <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-red-500">
        Rubrik
      </p>
      <h1 class="mt-2 text-4xl font-bold text-neutral-50">{{ heading() }}</h1>
    </div>
  </section>

  <section class="mx-auto max-w-6xl px-4 py-12 sm:px-6">
    @if (reviews() === undefined) {
      <app-review-card-skeleton [count]="8" />
    } @else if (reviews()!.length === 0) {
      <p class="text-neutral-400">
        Noch keine Reviews in dieser Rubrik. Schauen Sie bald wieder vorbei!
      </p>
    } @else {
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        @for (review of reviews(); track review.id) {
          <app-review-card [review]="review" />
        }
      </div>
    }
  </section>
} @else {
  <app-not-found />
}
