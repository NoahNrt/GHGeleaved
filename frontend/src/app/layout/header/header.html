<header class="sticky top-0 z-40 border-b border-neutral-800 bg-neutral-950/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-4 py-4 sm:px-6">
    <a
      routerLink="/"
      class="flex items-center gap-2 text-xl font-bold tracking-wider text-neutral-50 hover:text-red-500"
    >
      <span class="text-red-600">❖</span>
      <span>ROTER&nbsp;DORN</span>
    </a>

    <nav class="flex items-center gap-1 text-sm sm:gap-2 sm:text-base">
      <a
        routerLink="/"
        routerLinkActive="text-red-500 border-red-500"
        [routerLinkActiveOptions]="{ exact: true }"
        class="border-b-2 border-transparent px-2 py-1 text-neutral-200 transition-colors hover:text-red-400 sm:px-3"
      >
        Home
      </a>
      @for (genre of genres; track genre.value) {
        <a
          [routerLink]="['/', genre.value]"
          routerLinkActive="text-red-500 border-red-500"
          class="border-b-2 border-transparent px-2 py-1 text-neutral-200 transition-colors hover:text-red-400 sm:px-3"
        >
          {{ genre.label }}
        </a>
      }
    </nav>
  </div>
</header>
